<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 570" width="1000" height="570" font-family="Segoe UI, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs>
<rect width="1000" height="570" fill="#FFFFFF"/>
<text x="30" y="32" font-size="18" font-weight="700" fill="#111827">Genius Agenda AI - Arquitetura</text>
<text x="30" y="58" font-size="13" font-weight="600" fill="#4F46E5">FLUXO 1 - Conversa (workflow 01)</text>
<rect x="30" y="75" width="150" height="60" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/><text x="105.0" y="100.5" text-anchor="middle" font-size="13" font-weight="600" fill="#1F2937">Usuário</text><text x="105.0" y="117.5" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1F2937">WhatsApp</text>
<rect x="210" y="75" width="150" height="60" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/><text x="285.0" y="100.5" text-anchor="middle" font-size="13" font-weight="600" fill="#1F2937">WAHA (Docker)</text><text x="285.0" y="117.5" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1F2937">sessão WhatsApp</text>
<rect x="390" y="75" width="150" height="60" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/><text x="465.0" y="100.5" text-anchor="middle" font-size="13" font-weight="600" fill="#1F2937">n8n Webhook</text><text x="465.0" y="117.5" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1F2937">POST /genius-agenda</text>
<rect x="570" y="75" width="150" height="60" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/><text x="645.0" y="100.5" text-anchor="middle" font-size="13" font-weight="600" fill="#1F2937">Filtrar e deduplicar</text><text x="645.0" y="117.5" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1F2937">allowlist + id da msg</text>
<rect x="750" y="75" width="220" height="60" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/><text x="860.0" y="100.5" text-anchor="middle" font-size="13" font-weight="600" fill="#1F2937">Agente de IA (Gemini)</text><text x="860.0" y="117.5" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1F2937">memória por chat + prompt</text>
<path d="M180,105 H210" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#a)"/>
<path d="M360,105 H390" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#a)"/>
<path d="M540,105 H570" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#a)"/>
<path d="M720,105 H750" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="365" y="195" width="200" height="60" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/><text x="465.0" y="220.5" text-anchor="middle" font-size="13" font-weight="600" fill="#1F2937">Resposta / aviso de falha</text><text x="465.0" y="237.5" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1F2937">HTTP -> WAHA sendText</text>
<rect x="750" y="195" width="220" height="60" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/><text x="860.0" y="220.5" text-anchor="middle" font-size="13" font-weight="600" fill="#1F2937">Ferramentas do agente</text><text x="860.0" y="237.5" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1F2937">consultar / criar / atualizar / excluir</text>
<rect x="750" y="300" width="220" height="50" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/><text x="860.0" y="320.5" text-anchor="middle" font-size="13" font-weight="600" fill="#1F2937">Google Calendar API</text><text x="860.0" y="337.5" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1F2937">dados reais (OAuth2)</text>
<path d="M860,135 V195" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#a)"/>
<path d="M800,135 V165 H465 V195" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#a)"/>
<path d="M365,225 H285 V135" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#a)"/>
<path d="M860,255 V300" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="30" y1="385" x2="970" y2="385" stroke="#E5E7EB" stroke-width="1.5"/>
<text x="30" y="410" font-size="13" font-weight="600" fill="#4F46E5">FLUXO 2 - Lembretes automáticos (workflow 02) - independe do usuário falar</text>
<rect x="30" y="430" width="170" height="60" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/><text x="115.0" y="455.5" text-anchor="middle" font-size="13" font-weight="600" fill="#1F2937">Agendador</text><text x="115.0" y="472.5" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1F2937">a cada 1 minuto</text>
<rect x="220" y="430" width="170" height="60" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/><text x="305.0" y="455.5" text-anchor="middle" font-size="13" font-weight="600" fill="#1F2937">Buscar eventos</text><text x="305.0" y="472.5" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1F2937">próximas 25 h</text>
<rect x="410" y="430" width="170" height="60" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/><text x="495.0" y="455.5" text-anchor="middle" font-size="13" font-weight="600" fill="#1F2937">Calcular devidos</text><text x="495.0" y="472.5" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1F2937">24 h / 1 h / 15 min</text>
<rect x="600" y="430" width="170" height="60" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/><text x="685.0" y="455.5" text-anchor="middle" font-size="13" font-weight="600" fill="#1F2937">Enviar lembrete</text><text x="685.0" y="472.5" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1F2937">HTTP -> WAHA sendText</text>
<rect x="790" y="430" width="170" height="60" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/><text x="875.0" y="455.5" text-anchor="middle" font-size="13" font-weight="600" fill="#1F2937">Registrar enviados</text><text x="875.0" y="472.5" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1F2937">só se o envio deu certo</text>
<path d="M200,460 H220" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#a)"/>
<path d="M390,460 H410" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#a)"/>
<path d="M580,460 H600" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#a)"/>
<path d="M770,460 H790" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="220" y="520" width="170" height="40" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/><text x="305.0" y="544.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1F2937">Google Calendar API</text>
<path d="M305,490 V520" fill="none" stroke="#374151" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text x="410" y="536" text-anchor="start" font-size="11" fill="#6B7280">Estado: static data do n8n (chave = id|início|offset)</text>
<text x="410" y="552" text-anchor="start" font-size="11" fill="#6B7280">Reagendou/excluiu? A consulta reflete a agenda real; chave nova, sem aviso no horário antigo.</text>
</svg>